<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Ticket Formatter</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 20px 20px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .autocomplete-items {
            position: absolute; border: 1px solid #4a5568; border-top: none; z-index: 99;
            top: 100%; left: 0; right: 0; background-color: #1f2937;
            border-radius: 0 0 0.5rem 0.5rem; max-height: 200px; overflow-y: auto;
        }
        .autocomplete-items div {
            padding: 10px; cursor: pointer; color: #d1d5db; border-bottom: 1px solid #374151;
        }
        .autocomplete-items div:last-child { border-bottom: none; }
        .autocomplete-items div:hover { background-color: #374151; color: #ffffff; }
        .autocomplete-active { background-color: #4f46e5 !important; color: #ffffff; }
        
        .tab-button.active, .trip-tab.active { background-color: #4f46e5; color: white; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .output-ticket { border-left: 5px solid #4f46e5; }
        
        #toast-popup {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; z-index: 100;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 antialiased flex flex-col min-h-screen">
    <div class="container mx-auto p-4 md:p-8 flex-grow">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-white flex items-center justify-center gap-3">
                <i class="fa-solid fa-plane-departure text-indigo-400"></i>
                Flight Ticket Formatter
            </h1>
            <p class="text-gray-400 mt-2">Buat format tiket penerbangan dengan cepat dan akurat.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Input Section -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl">
                
                <!-- Tipe Perjalanan Tabs -->
                <div class="flex space-x-2 bg-gray-700 p-1 rounded-lg mb-6">
                    <button id="tripOneWayTab" class="trip-tab flex-1 p-2 rounded-md text-sm font-medium transition active">Sekali Jalan</button>
                    <button id="tripRoundTripTab" class="trip-tab flex-1 p-2 rounded-md text-sm font-medium transition">Pulang Pergi / Multi</button>
                </div>

                <h2 class="text-2xl font-semibold mb-6 border-b border-gray-700 pb-4 text-white flex items-center gap-3"><i class="fa-solid fa-file-invoice"></i> Detail Penerbangan</h2>
                
                <!-- TAB 1: SEKALI JALAN (ONE WAY) -->
                <div id="sectionOneWay" class="space-y-6">
                    <!-- Route -->
                    <div class="flex flex-col md:flex-row items-center gap-2 md:gap-4">
                        <div class="relative autocomplete w-full">
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-plane-up w-4"></i> Penerbangan Asal</label>
                            <input type="text" id="origin" placeholder="Contoh: JAKARTA (CGK)" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                        </div>
                        <div class="mt-2 md:mt-6">
                            <button id="swapRouteButton" class="p-2 w-10 h-10 rounded-full bg-gray-600 hover:bg-indigo-600 text-white transition-all"><i class="fa-solid fa-right-left"></i></button>
                        </div>
                        <div class="relative autocomplete w-full">
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-plane-arrival w-4"></i> Penerbangan Tujuan</label>
                            <input type="text" id="destination" placeholder="Contoh: SINGAPORE (SIN)" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                        </div>
                    </div>

                    <!-- Date -->
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-calendar-days w-4"></i> Tanggal Keberangkatan</label>
                        <input type="date" id="flightDate" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition" style="color-scheme: dark;">
                    </div>

                    <!-- Airline -->
                    <div class="relative autocomplete">
                        <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-jet-fighter w-4"></i> Maskapai</label>
                        <input type="text" id="airline" placeholder="Contoh: AirAsia Indonesia" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                    </div>

                    <!-- Flight Time & Code -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-regular fa-clock"></i> Jam Berangkat</label>
                            <input type="time" id="departureTime" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition" style="color-scheme: dark;">
                        </div>
                        <div>
                             <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-clock"></i> Jam Tiba</label>
                            <input type="time" id="arrivalTime" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition" style="color-scheme: dark;">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-barcode"></i> Kode</label>
                            <div class="flex">
                                <span id="airlineCode" class="inline-flex items-center px-3 rounded-l-lg bg-gray-600 text-gray-300 border border-r-0 border-gray-600">--</span>
                                <input type="text" id="flightCode" placeholder="262" class="w-full bg-gray-700 border border-gray-600 text-white rounded-r-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: PULANG PERGI / MULTI (ROUND TRIP) -->
                <div id="sectionRoundTrip" class="space-y-6 hidden">
                    <!-- RT Route -->
                    <div>
                        <div class="flex flex-col md:flex-row items-center gap-2 md:gap-4">
                            <div class="relative autocomplete w-full">
                                <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-plane-up w-4"></i> Penerbangan Asal (Pergi)</label>
                                <input type="text" id="rtOrigin1" placeholder="Contoh: JAKARTA (CGK)" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                            <div class="mt-2 md:mt-6">
                                <button id="rtSwapRoute1" class="p-2 w-10 h-10 rounded-full bg-gray-600 hover:bg-indigo-600 text-white transition-all"><i class="fa-solid fa-right-left"></i></button>
                            </div>
                            <div class="relative autocomplete w-full">
                                <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-plane-arrival w-4"></i> Penerbangan Tujuan (Pulang)</label>
                                <input type="text" id="rtDest1" placeholder="Contoh: KUALA LUMPUR (KUL)" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                        </div>
                        
                        <!-- RT Route Checkbox -->
                        <div class="flex items-center space-x-4 mt-3">
                            <label class="flex items-center text-sm text-gray-300 cursor-pointer">
                                <input type="checkbox" id="rtIsPP" checked class="mr-2 rounded text-indigo-500 bg-gray-700 border-gray-600 focus:ring-indigo-500 w-4 h-4">
                                <i>Rute Pulang Sama (PP)</i>
                            </label>
                        </div>
                        
                        <!-- Route 2 (Return/Multi) - Muncul jika Checkbox PP tidak dicentang -->
                        <div id="rtRoute2Container" class="hidden flex-col md:flex-row items-center gap-2 md:gap-4 mt-4">
                            <div class="relative autocomplete w-full">
                                <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-plane-up w-4"></i> Penerbangan Asal (Pergi)</label>
                                <input type="text" id="rtOrigin2" placeholder="Contoh: SINGAPORE (SIN)" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                            <div class="mt-2 md:mt-6">
                                <button id="rtSwapRoute2" class="p-2 w-10 h-10 rounded-full bg-gray-600 hover:bg-indigo-600 text-white transition-all"><i class="fa-solid fa-right-left"></i></button>
                            </div>
                            <div class="relative autocomplete w-full">
                                <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-plane-arrival w-4"></i> Penerbangan Tujuan (Pulang)</label>
                                <input type="text" id="rtDest2" placeholder="Contoh: JAKARTA (CGK)" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                        </div>
                    </div>

                    <!-- RT Dates -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-calendar-days w-4"></i> Tgl Berangkat</label>
                            <input type="date" id="rtDate1" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition" style="color-scheme: dark;">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-calendar-check w-4"></i> Tgl Pulang</label>
                            <input type="date" id="rtDate2" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition" style="color-scheme: dark;">
                        </div>
                    </div>

                    <!-- RT Airline -->
                    <div>
                        <div class="relative autocomplete">
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-jet-fighter w-4"></i>  Maskapai (Pergi)</label>
                            <input type="text" id="rtAirline1" placeholder="Contoh: AirAsia Berhad" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                        </div>

                        <!-- RT Airline Checkbox -->
                        <div class="flex items-center space-x-4 mt-3">
                            <label class="flex items-center text-sm text-gray-300 cursor-pointer">
                                <input type="checkbox" id="rtSameAirline" checked class="mr-2 rounded text-indigo-500 bg-gray-700 border-gray-600 focus:ring-indigo-500 w-4 h-4">
                                <i>Maskapai Pulang Sama</i>
                            </label>
                        </div>
                        
                        <!-- Airline 2 (Return) - Muncul jika Checkbox Maskapai Sama tidak dicentang -->
                        <div id="rtAirline2Container" class="hidden relative autocomplete mt-4">
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-jet-fighter w-4"></i>  Maskapai (Pulang)</label>
                            <input type="text" id="rtAirline2" placeholder="Contoh: Lion Air" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <!-- RT Flight Time & Code (Satu Baris Sejajar & Tanpa Kotak) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Pergi Time & Code -->
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-regular fa-clock"></i> Jam Berangkat (Pergi)</label>
                            <input type="time" id="rtDepTime1" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition" style="color-scheme: dark;">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-clock"></i> Jam Berangkat (Pulang)</label>
                            <input type="time" id="rtDepTime2" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition" style="color-scheme: dark;">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-barcode"></i> Kode (Pergi)</label>
                            <div class="flex">
                                <span id="rtAirlineCode1" class="inline-flex items-center px-3 rounded-l-lg bg-gray-600 text-gray-300 border border-r-0 border-gray-600">--</span>
                                <input type="text" id="rtFlightCode1" placeholder="351" class="w-full bg-gray-700 border border-gray-600 text-white rounded-r-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fa-solid fa-barcode"></i> Kode (Pulang)</label>
                            <div class="flex">
                                <span id="rtAirlineCode2" class="inline-flex items-center px-3 rounded-l-lg bg-gray-600 text-gray-300 border border-r-0 border-gray-600">--</span>
                                <input type="text" id="rtFlightCode2" placeholder="200" class="w-full bg-gray-700 border border-gray-600 text-white rounded-r-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SHARED: Passenger Data Section -->
                <div id="paxDataSection" class="mt-8 pt-6 border-t border-gray-700">
                    <h3 class="text-xl font-semibold mb-4 text-white flex items-center gap-3"><i class="fa-solid fa-users"></i> Data Penumpang (PAX)</h3>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-300 mb-1">Jumlah Penumpang</label>
                        <input type="number" id="paxCount" min="1" placeholder="Contoh: 5" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition">
                    </div>

                    <div class="mb-4">
                        <div class="flex space-x-2 bg-gray-700 p-1 rounded-lg">
                            <button id="manualTab" class="tab-button flex-1 p-2 rounded-md text-sm font-medium transition active"><i class="fa-solid fa-keyboard mr-2"></i>Manual</button>
                            <button id="excelTab" class="tab-button flex-1 p-2 rounded-md text-sm font-medium transition"><i class="fa-solid fa-file-excel mr-2"></i>Excel</button>
                            <button id="imageTab" class="tab-button flex-1 p-2 rounded-md text-sm font-medium transition"><i class="fa-solid fa-file-image mr-2"></i>Image</button>
                        </div>
                    </div>

                    <!-- Manual Input Area -->
                    <div id="manualInputArea" class="space-y-4"></div>

                    <!-- Excel/Spreadsheet Input Area -->
                    <div id="excelInputArea" class="hidden">
                        <label class="block text-sm font-medium text-gray-300 mb-2">Paste data dari Excel/Spreadsheet:</label>
                        <textarea id="excelPaste" rows="8" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition custom-scrollbar" placeholder="Contoh:&#10;ROCHMAT GUMELAR 	Sukabumi, 31 Desember 2008"></textarea>
                    </div>

                    <!-- Image Text Input Area -->
                    <div id="imageInputArea" class="hidden">
                         <label class="block text-sm font-medium text-gray-300 mb-2">Paste data dari hasil Image-to-Text:</label>
                        <textarea id="imagePaste" rows="8" class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 transition custom-scrollbar" placeholder="Contoh:&#10;NAMA PENUMPANG 1&#10;NAMA PENUMPANG 2&#10;Kota, 29 November 2008 Kota, 18 Agustus 2008"></textarea>
                    </div>
                </div>
            </div>

            <!-- Output Section -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl flex flex-col h-full lg:sticky lg:top-8">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-4">
                    <h2 class="text-2xl font-semibold text-white flex items-center gap-3"><i class="fa-solid fa-ticket text-indigo-400"></i>Hasil Format</h2>
                    <div class="flex items-center space-x-3">
                        <button id="copyButton" class="p-2 w-10 h-10 flex items-center justify-center rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white transition-all duration-200" title="Salin Teks">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <button id="lockButton" class="p-2 w-10 h-10 flex items-center justify-center rounded-lg bg-gray-700 hover:bg-gray-600 text-white transition-all duration-200" title="Kunci/Buka Edit">
                            <span id="lockIcon"><i class="fa-solid fa-lock"></i></span>
                            <span id="unlockIcon" class="hidden"><i class="fa-solid fa-lock-open"></i></span>
                        </button>
                    </div>
                </div>
                <textarea id="output" readonly class="flex-grow w-full bg-gray-900 text-gray-300 rounded-lg p-4 font-mono text-sm whitespace-pre border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none custom-scrollbar transition-all duration-300 output-ticket min-h-[400px]" style="line-height: 1.6;"></textarea>
            </div>
        </div>
    </div>
    <footer class="text-center p-4 mt-8 bg-gray-800/50">
        <p class="text-sm text-gray-400">Dibuat oleh <a href="https://totiard.github.io/Profile-New/" target="_blank" rel="noopener noreferrer" class="font-semibold text-indigo-400 hover:text-indigo-300">Toti Ardianysah</a></p>
    </footer>

    <!-- Toast/Popup -->
    <div id="toast-popup" class="hidden opacity-0 bg-green-500 text-white text-sm font-bold px-6 py-3 rounded-lg shadow-lg">
        <i class="fa-solid fa-check-circle mr-2"></i> Teks berhasil disalin!
    </div>

    <!-- Datalist for Month input -->
    <datalist id="month-list"></datalist>

    <script>
        // --- DATA ---
        let airports = [];
        let airlines = [];
        
        // --- CONSTANTS ---
        const monthIndonesian = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const monthEnglishShort = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

        // --- DOM ELEMENTS ---
        const elements = {
            // Trip Type
            tripOneWayTab: document.getElementById('tripOneWayTab'),
            tripRoundTripTab: document.getElementById('tripRoundTripTab'),
            sectionOneWay: document.getElementById('sectionOneWay'),
            sectionRoundTrip: document.getElementById('sectionRoundTrip'),

            // One Way Elements
            origin: document.getElementById('origin'),
            destination: document.getElementById('destination'),
            swapRouteButton: document.getElementById('swapRouteButton'),
            flightDate: document.getElementById('flightDate'),
            airline: document.getElementById('airline'),
            departureTime: document.getElementById('departureTime'),
            arrivalTime: document.getElementById('arrivalTime'),
            airlineCode: document.getElementById('airlineCode'),
            flightCode: document.getElementById('flightCode'),

            // Round Trip Elements
            rtOrigin1: document.getElementById('rtOrigin1'),
            rtDest1: document.getElementById('rtDest1'),
            rtSwapRoute1: document.getElementById('rtSwapRoute1'),
            rtIsPP: document.getElementById('rtIsPP'),
            rtRoute2Container: document.getElementById('rtRoute2Container'),
            rtOrigin2: document.getElementById('rtOrigin2'),
            rtDest2: document.getElementById('rtDest2'),
            rtSwapRoute2: document.getElementById('rtSwapRoute2'),
            
            rtDate1: document.getElementById('rtDate1'),
            rtDate2: document.getElementById('rtDate2'),
            
            rtAirline1: document.getElementById('rtAirline1'),
            rtSameAirline: document.getElementById('rtSameAirline'),
            rtAirline2Container: document.getElementById('rtAirline2Container'),
            rtAirline2: document.getElementById('rtAirline2'),
            
            rtDepTime1: document.getElementById('rtDepTime1'),
            rtDepTime2: document.getElementById('rtDepTime2'),
            
            rtAirlineCode1: document.getElementById('rtAirlineCode1'),
            rtFlightCode1: document.getElementById('rtFlightCode1'),
            rtAirlineCode2: document.getElementById('rtAirlineCode2'),
            rtFlightCode2: document.getElementById('rtFlightCode2'),

            // Shared PAX Elements
            paxCount: document.getElementById('paxCount'),
            manualInputArea: document.getElementById('manualInputArea'),
            excelInputArea: document.getElementById('excelInputArea'),
            imageInputArea: document.getElementById('imageInputArea'),
            excelPaste: document.getElementById('excelPaste'),
            imagePaste: document.getElementById('imagePaste'),
            manualTab: document.getElementById('manualTab'),
            excelTab: document.getElementById('excelTab'),
            imageTab: document.getElementById('imageTab'),

            // Utility Elements
            output: document.getElementById('output'),
            copyButton: document.getElementById('copyButton'),
            lockButton: document.getElementById('lockButton'),
            lockIcon: document.getElementById('lockIcon'),
            unlockIcon: document.getElementById('unlockIcon'),
            toastPopup: document.getElementById('toast-popup'),
        };

        // --- STATE ---
        let state = {
            tripType: 'oneway', // 'oneway' or 'roundtrip'
            activeTab: 'manual', // pax data tab
            paxData: []
        };

        // --- UTILITY FUNCTIONS ---
        const formatDate = (dateStr) => {
            if (!dateStr) return "Tanggal DD Bulan YYYY";
            const date = new Date(dateStr);
            const day = date.getUTCDate();
            const month = monthIndonesian[date.getUTCMonth()];
            const year = date.getUTCFullYear();
            return `Tanggal ${day} ${month} ${year}`;
        };

        const formatDob = (date) => {
            if (!date || isNaN(date)) return "DDMMM YYYY";
            const day = String(date.getDate()).padStart(2, '0');
            const month = monthEnglishShort[date.getMonth()];
            const year = date.getFullYear();
            return `${day}${month} ${year}`;
        };
        
        const getIataCode = (value) => {
            const match = value.match(/\(([^)]+)\)$/);
            return match ? match[1].trim() : (value.trim() || '...');
        };

        // --- TAB SWITCHING (TRIP TYPE) ---
        elements.tripOneWayTab.addEventListener('click', () => {
            state.tripType = 'oneway';
            elements.tripOneWayTab.classList.add('active');
            elements.tripRoundTripTab.classList.remove('active');
            elements.sectionOneWay.classList.remove('hidden');
            elements.sectionRoundTrip.classList.add('hidden');
            generateOutput();
        });

        elements.tripRoundTripTab.addEventListener('click', () => {
            state.tripType = 'roundtrip';
            elements.tripRoundTripTab.classList.add('active');
            elements.tripOneWayTab.classList.remove('active');
            elements.sectionRoundTrip.classList.remove('hidden');
            elements.sectionOneWay.classList.add('hidden');
            generateOutput();
        });

        // --- ROUND TRIP TOGGLES ---
        elements.rtIsPP.addEventListener('change', (e) => {
            if(e.target.checked) {
                elements.rtRoute2Container.classList.add('hidden');
                elements.rtRoute2Container.classList.remove('flex');
            } else {
                elements.rtRoute2Container.classList.remove('hidden');
                elements.rtRoute2Container.classList.add('flex');
            }
            generateOutput();
        });

        elements.rtSameAirline.addEventListener('change', (e) => {
            if(e.target.checked) {
                elements.rtAirline2Container.classList.add('hidden');
                elements.rtAirlineCode2.textContent = elements.rtAirlineCode1.textContent;
            } else {
                elements.rtAirline2Container.classList.remove('hidden');
                // Evaluasi ulang kode maskapai 2
                const selectedAirline = airlines.find(a => a.name === elements.rtAirline2.value);
                elements.rtAirlineCode2.textContent = selectedAirline ? selectedAirline.code : '--';
            }
            generateOutput();
        });

        // --- CORE LOGIC ---
        function generateOutput() {
            if (!elements.output.readOnly) return; // Only generate if output is locked

            processPaxData();
            let paxDataString = "";
            if (state.paxData.length > 0) {
                paxDataString = "\n\nData Pax :\n\n";
                paxDataString += state.paxData.map((pax, index) => {
                    const name = (pax.name || 'NAMA PENUMPANG').toUpperCase();
                    const dob = pax.dob || 'TANGGAL LAHIR';
                    return `${index + 1}. ${name}\nTanggal lahir : ${dob}`;
                }).join('\n\n');
            }

            const paxNum = elements.paxCount.value || 'X';
            let finalOutput = "";

            if (state.tripType === 'oneway') {
                const originCode = getIataCode(elements.origin.value);
                const destinationCode = getIataCode(elements.destination.value);
                const dateText = formatDate(elements.flightDate.value);
                const airlineName = elements.airline.value || 'Nama Maskapai';
                const depTime = elements.departureTime.value.replace(':', '.') || '00.00';
                const arrTime = elements.arrivalTime.value.replace(':', '.') || '00.00';
                const airlineIata = elements.airlineCode.textContent;
                const flightNum = elements.flightCode.value || 'XXX';

                finalOutput = `${originCode} - ${destinationCode}\n` +
                              `${dateText}\n` +
                              `${airlineName}\n` +
                              `${depTime} - ${arrTime} // ${airlineIata}-${flightNum}\n` +
                              `${paxNum} PAX` +
                              `${paxDataString}`;
            } else {
                // ROUND TRIP LOGIC
                
                // 1. Route
                let routeStr = "";
                const o1 = getIataCode(elements.rtOrigin1.value);
                const d1 = getIataCode(elements.rtDest1.value);
                if (elements.rtIsPP.checked) {
                    routeStr = `${o1} - ${d1} PP`;
                } else {
                    const o2 = getIataCode(elements.rtOrigin2.value);
                    const d2 = getIataCode(elements.rtDest2.value);
                    routeStr = `${o1} - ${d1} & ${o2} - ${d2}`;
                }

                // 2. Date
                let dateStr = "";
                if (elements.rtDate1.value && elements.rtDate2.value) {
                    const d1 = new Date(elements.rtDate1.value);
                    const d2 = new Date(elements.rtDate2.value);
                    
                    const day1 = d1.getUTCDate();
                    const month1Indo = monthIndonesian[d1.getUTCMonth()];
                    const month1Short = monthEnglishShort[d1.getUTCMonth()];
                    const year1 = d1.getUTCFullYear();
                    
                    const day2 = d2.getUTCDate();
                    const month2Indo = monthIndonesian[d2.getUTCMonth()];
                    const month2Short = monthEnglishShort[d2.getUTCMonth()];
                    const year2 = d2.getUTCFullYear();

                    if (year1 === year2 && month1Indo === month2Indo) {
                        // Bulan Sama
                        dateStr = `Tanggal ${day1} & ${day2} ${month1Indo} ${year1}`;
                    } else if (year1 === year2) {
                        // Bulan Beda, Tahun Sama
                        dateStr = `Tanggal ${day1} ${month1Short} & ${day2} ${month2Short} ${year1}`;
                    } else {
                        // Tahun Beda
                        dateStr = `Tanggal ${day1} ${month1Short} ${year1} & ${day2} ${month2Short} ${year2}`;
                    }
                } else {
                    dateStr = "Tanggal DD & DD Bulan YYYY";
                }

                // 3. Airline
                let airlineStr = elements.rtAirline1.value || 'Maskapai Berangkat';
                if (!elements.rtSameAirline.checked) {
                    airlineStr += ` & ${elements.rtAirline2.value || 'Maskapai Pulang'}`;
                }

                // 4. Time & Flight Code
                const t1Dep = elements.rtDepTime1.value.replace(':', '.') || '00.00';
                const t2Dep = elements.rtDepTime2.value.replace(':', '.') || '00.00';
                
                const c1 = `${elements.rtAirlineCode1.textContent}-${elements.rtFlightCode1.value || 'XXX'}`;
                const c2 = `${elements.rtAirlineCode2.textContent}-${elements.rtFlightCode2.value || 'XXX'}`;
                
                // Format: Dep1 & Dep2 // Code1 & Code2
                const timeCodeStr = `${t1Dep} & ${t2Dep} // ${c1} & ${c2}`;

                finalOutput = `${routeStr}\n` +
                              `${dateStr}\n` +
                              `${airlineStr}\n` +
                              `${timeCodeStr}\n` +
                              `${paxNum} PAX` +
                              `${paxDataString}`;
            }

            elements.output.value = finalOutput;
        }

        function processPaxData() {
            const paxCount = parseInt(elements.paxCount.value) || 0;
            state.paxData = [];

            if (state.activeTab === 'manual') {
                for (let i = 0; i < paxCount; i++) {
                    const nameInput = document.getElementById(`paxName${i}`);
                    const dayInput = document.getElementById(`paxDay${i}`);
                    const monthInput = document.getElementById(`paxMonth${i}`);
                    const yearInput = document.getElementById(`paxYear${i}`);
                    
                    if (nameInput && dayInput && monthInput && yearInput) {
                        const day = dayInput.value;
                        const monthValue = monthInput.value;
                        const year = yearInput.value;
                        
                        const monthIndex = monthIndonesian.findIndex(m => m.toLowerCase() === monthValue.toLowerCase());
                        
                        let dobDate = null;
                        if(day && monthIndex > -1 && year) {
                            dobDate = new Date(year, monthIndex, day);
                        }
                        state.paxData.push({
                            name: nameInput.value,
                            dob: formatDob(dobDate)
                        });
                    }
                }
            } else if (state.activeTab === 'excel') {
                const text = elements.excelPaste.value.trim();
                if (!text) return;
                const lines = text.split('\n');
                state.paxData = lines.map(line => {
                    const parts = line.split(/\t+/);
                    const name = parts[0] ? parts[0].trim() : '';
                    let dob = '';
                    if (parts[1]) {
                        const datePart = parts[1].split(',').pop().trim();
                        const dateMatch = datePart.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
                        if (dateMatch) {
                            const day = dateMatch[1];
                            const monthName = dateMatch[2];
                            const year = dateMatch[3];
                            const monthIndex = monthIndonesian.findIndex(m => m.toLowerCase() === monthName.toLowerCase());
                            if (monthIndex !== -1) {
                                dob = formatDob(new Date(year, monthIndex, day));
                            }
                        }
                    }
                    return { name, dob };
                }).slice(0, paxCount || lines.length);
            } else if (state.activeTab === 'image') {
                const text = elements.imagePaste.value.trim();
                if (!text) return;
                
                const dateRegex = /(?:[A-Za-z]+,\s*)?(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/g;
                let dates = [];
                let match;
                while ((match = dateRegex.exec(text)) !== null) {
                    const day = match[1];
                    const monthName = match[2];
                    const year = match[3];
                    const monthIndex = monthIndonesian.findIndex(m => m.toLowerCase() === monthName.toLowerCase());
                    if (monthIndex !== -1) {
                        dates.push(formatDob(new Date(year, monthIndex, day)));
                    }
                }

                const namesText = text.replace(dateRegex, '').replace(/\n\s*\n/g, '\n').trim();
                const names = namesText.split('\n').map(n => n.trim()).filter(Boolean);

                const count = Math.min(names.length, dates.length, paxCount || Math.min(names.length, dates.length));
                for(let i=0; i < count; i++) {
                    state.paxData.push({ name: names[i] || '', dob: dates[i] || '' });
                }
            }
        }

        function updateManualPaxInputs() {
            const count = parseInt(elements.paxCount.value) || 0;
            elements.manualInputArea.innerHTML = '';
            if (count > 0 && count < 50) {
                let html = '';
                for (let i = 0; i < count; i++) {
                    html += `
                        <div class="bg-gray-750 p-4 rounded-lg border border-gray-700">
                            <p class="font-semibold text-white mb-3 text-sm">Penumpang ${i + 1}</p>
                            <div class="mb-3">
                                <input type="text" id="paxName${i}" placeholder="Nama Lengkap" class="w-full bg-gray-600 border border-gray-500 text-white rounded-md p-2 focus:ring-1 focus:ring-indigo-500 transition">
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <input type="number" id="paxDay${i}" placeholder="Tgl" min="1" max="31" class="w-full bg-gray-600 border border-gray-500 text-white rounded-md p-2 focus:ring-1 focus:ring-indigo-500 transition">
                                <input type="text" id="paxMonth${i}" list="month-list" placeholder="Bulan" class="w-full bg-gray-600 border border-gray-500 text-white rounded-md p-2 focus:ring-1 focus:ring-indigo-500 transition">
                                <input type="number" id="paxYear${i}" placeholder="Tahun" min="1900" max="${new Date().getFullYear()}" class="w-full bg-gray-600 border border-gray-500 text-white rounded-md p-2 focus:ring-1 focus:ring-indigo-500 transition">
                            </div>
                        </div>
                    `;
                }
                elements.manualInputArea.innerHTML = html;
                for (let i = 0; i < count; i++) {
                    document.getElementById(`paxName${i}`).addEventListener('input', generateOutput);
                    document.getElementById(`paxDay${i}`).addEventListener('input', generateOutput);
                    document.getElementById(`paxMonth${i}`).addEventListener('input', generateOutput);
                    document.getElementById(`paxYear${i}`).addEventListener('input', generateOutput);
                }
            }
            generateOutput();
        }

        function autocomplete(inp, arr) {
            let currentFocus;
            const closeAllLists = (elmnt) => {
                const x = document.getElementsByClassName("autocomplete-items");
                for (let i = 0; i < x.length; i++) {
                    if (elmnt != x[i] && elmnt != inp) {
                        x[i].parentNode.removeChild(x[i]);
                    }
                }
                
                // Handle Sinkronisasi Airline Code 
                if (inp.id === 'airline') {
                    const selectedAirline = airlines.find(a => a.name === inp.value);
                    elements.airlineCode.textContent = selectedAirline ? selectedAirline.code : '--';
                } else if (inp.id === 'rtAirline1') {
                    const selectedAirline = airlines.find(a => a.name === inp.value);
                    elements.rtAirlineCode1.textContent = selectedAirline ? selectedAirline.code : '--';
                    // Jika Maskapai Pulang Sama diceklis, otomatis sinkronkan kode
                    if (elements.rtSameAirline.checked) {
                        elements.rtAirlineCode2.textContent = elements.rtAirlineCode1.textContent;
                    }
                } else if (inp.id === 'rtAirline2') {
                    // Update kode maskapai pulang mandiri HANYA jika checkbox 'maskapai sama' tidak diceklis
                    if (!elements.rtSameAirline.checked) {
                        const selectedAirline = airlines.find(a => a.name === inp.value);
                        elements.rtAirlineCode2.textContent = selectedAirline ? selectedAirline.code : '--';
                    }
                }
                generateOutput();
            }

            const createList = (filter) => {
                let a, b, i, val = filter;
                closeAllLists();
                currentFocus = -1;
                a = document.createElement("DIV");
                a.setAttribute("id", inp.id + "autocomplete-list");
                a.setAttribute("class", "autocomplete-items custom-scrollbar");
                inp.parentNode.appendChild(a);
                for (i = 0; i < arr.length; i++) {
                    if (!val || arr[i].name.toUpperCase().includes(val.toUpperCase())) {
                        b = document.createElement("DIV");
                        if (val) {
                            const matchIndex = arr[i].name.toUpperCase().indexOf(val.toUpperCase());
                            b.innerHTML = arr[i].name.substring(0, matchIndex) +
                                          "<strong>" + arr[i].name.substring(matchIndex, matchIndex + val.length) + "</strong>" +
                                          arr[i].name.substring(matchIndex + val.length);
                        } else {
                            b.innerHTML = arr[i].name;
                        }
                        b.innerHTML += "<input type='hidden' value='" + arr[i].name.replace(/'/g, "&#39;") + "'>";
                        b.addEventListener("click", function(e) {
                            inp.value = this.getElementsByTagName("input")[0].value;
                            closeAllLists(this);
                        });
                        a.appendChild(b);
                    }
                }
            };
            
            inp.addEventListener("input", function() { createList(this.value); });
            inp.addEventListener("click", function() {
                if (!document.getElementById(this.id + "autocomplete-list")) {
                    createList("");
                }
            });

            inp.addEventListener("keydown", function(e) {
                let x = document.getElementById(this.id + "autocomplete-list");
                if (x) x = x.getElementsByTagName("div");
                if (e.keyCode == 40) { currentFocus++; addActive(x); } 
                else if (e.keyCode == 38) { currentFocus--; addActive(x); } 
                else if (e.keyCode == 13) { e.preventDefault(); if (currentFocus > -1) { if (x) x[currentFocus].click(); } }
            });

            function addActive(x) {
                if (!x) return false;
                removeActive(x);
                if (currentFocus >= x.length) currentFocus = 0;
                if (currentFocus < 0) currentFocus = (x.length - 1);
                x[currentFocus].classList.add("autocomplete-active");
            }

            function removeActive(x) {
                for (let i = 0; i < x.length; i++) {
                    x[i].classList.remove("autocomplete-active");
                }
            }
            
            document.addEventListener("click", function (e) { closeAllLists(e.target); });
        }
        
        // --- EVENT LISTENERS ---
        // Bind generateOutput to all relevant inputs
        const inputsToBind = [
            'flightDate', 'departureTime', 'arrivalTime', 'flightCode',
            'rtDate1', 'rtDate2', 'rtDepTime1', 'rtDepTime2', 'rtFlightCode1', 'rtFlightCode2', 
            'excelPaste', 'imagePaste'
        ];
        inputsToBind.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener('input', generateOutput);
                el.addEventListener('change', generateOutput);
            }
        });

        elements.paxCount.addEventListener('input', updateManualPaxInputs);

        // Swap Routes Handlers
        elements.swapRouteButton.addEventListener('click', () => {
            [elements.origin.value, elements.destination.value] = [elements.destination.value, elements.origin.value];
            generateOutput();
        });
        elements.rtSwapRoute1.addEventListener('click', () => {
            [elements.rtOrigin1.value, elements.rtDest1.value] = [elements.rtDest1.value, elements.rtOrigin1.value];
            generateOutput();
        });
        elements.rtSwapRoute2.addEventListener('click', () => {
            [elements.rtOrigin2.value, elements.rtDest2.value] = [elements.rtDest2.value, elements.rtOrigin2.value];
            generateOutput();
        });

        // Lock/Copy
        elements.lockButton.addEventListener('click', () => {
            if (elements.output.readOnly) {
                elements.output.readOnly = false;
                elements.lockIcon.classList.add('hidden');
                elements.unlockIcon.classList.remove('hidden');
                elements.lockButton.classList.add('bg-green-600', 'hover:bg-green-700');
                elements.lockButton.classList.remove('bg-gray-700', 'hover:bg-gray-600');
                elements.output.classList.add('bg-gray-800');
                elements.output.classList.remove('bg-gray-900');
                elements.output.focus();
            } else {
                elements.output.readOnly = true;
                elements.lockIcon.classList.remove('hidden');
                elements.unlockIcon.classList.add('hidden');
                elements.lockButton.classList.remove('bg-green-600', 'hover:bg-green-700');
                elements.lockButton.classList.add('bg-gray-700', 'hover:bg-gray-600');
                elements.output.classList.remove('bg-gray-800');
                elements.output.classList.add('bg-gray-900');
                generateOutput();
            }
        });

        elements.copyButton.addEventListener('click', () => {
            elements.output.select();
            document.execCommand('copy');
            
            elements.toastPopup.classList.remove('hidden');
            setTimeout(() => elements.toastPopup.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                elements.toastPopup.classList.add('opacity-0');
                setTimeout(() => elements.toastPopup.classList.add('hidden'), 300);
            }, 2000);
        });

        // PAX Tabs
        function switchPaxTab(tabName) {
            state.activeTab = tabName;
            elements.manualInputArea.classList.toggle('hidden', tabName !== 'manual');
            elements.excelInputArea.classList.toggle('hidden', tabName !== 'excel');
            elements.imageInputArea.classList.toggle('hidden', tabName !== 'image');
            elements.manualTab.classList.toggle('active', tabName === 'manual');
            elements.excelTab.classList.toggle('active', tabName === 'excel');
            elements.imageTab.classList.toggle('active', tabName === 'image');
            generateOutput();
        }

        elements.manualTab.addEventListener('click', () => switchPaxTab('manual'));
        elements.excelTab.addEventListener('click', () => switchPaxTab('excel'));
        elements.imageTab.addEventListener('click', () => switchPaxTab('image'));

        // --- DATA FETCHING & INITIALIZATION ---
        async function initialize() {
            const monthDatalist = document.getElementById('month-list');
            monthIndonesian.forEach(month => {
                const option = document.createElement('option');
                option.value = month;
                monthDatalist.appendChild(option);
            });

            try {
                const [airlinesRes, airportsRes] = await Promise.all([
                    fetch('maskapai.json'),
                    fetch('airport-codes.csv')
                ]);

                if (airlinesRes.ok) {
                    const airlinesData = await airlinesRes.json();
                    airlines = airlinesData.map(item => ({ name: item.Airline, code: item.Kode })).sort((a, b) => a.name.localeCompare(b.name));
                }

                if (airportsRes.ok) {
                    const airportsCSV = await airportsRes.text();
                    const lines = airportsCSV.split('\n').slice(1);
                    airports = lines.map(line => {
                        const columns = line.split(',');
                        const iata = columns[9]?.replace(/"/g, '');
                        const name = columns[2]?.replace(/"/g, '');
                        const city = columns[7]?.replace(/"/g, '');
                        const type = columns[1]?.replace(/"/g, '');
                        if (iata && (type.includes('airport')) && !type.includes('closed')) {
                            return { name: `${city ? city.toUpperCase() : 'N/A'} - ${name.toUpperCase()} (${iata})`, code: iata };
                        }
                        return null;
                    }).filter(Boolean).sort((a,b) => a.name.localeCompare(b.name));
                }

            } catch (error) {
                console.error("Error fetching data:", error);
            }

            // Setup autocomplete
            const autoElements = [elements.origin, elements.destination, elements.rtOrigin1, elements.rtDest1, elements.rtOrigin2, elements.rtDest2];
            autoElements.forEach(el => autocomplete(el, airports));
            
            const airlineElements = [elements.airline, elements.rtAirline1, elements.rtAirline2];
            airlineElements.forEach(el => autocomplete(el, airlines));
            
            generateOutput();
        }

        window.onload = initialize;

    </script>
</body>
